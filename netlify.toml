[build]
  # Directory to run the build command in
  base = "frontend"
  command = "pnpm generate"
  
  # Directory where the build output is located (relative to 'base')
  publish = ".output/public"

[build.environment]
  # Ensure Node version is compatible
  NODE_VERSION = "20"

# Old URL of the 2D analysis page; must stay above the SPA fallback (query string is kept)
[[redirects]]
  from = "/tools/mfoil"
  to = "/tools/numerical-analysis-2d/"
  status = 301

# Handle Single Page Application (SPA) routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200